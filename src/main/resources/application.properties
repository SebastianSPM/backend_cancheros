spring.application.name=grupo10
spring.config.import=optional:file:.env[.properties]

# =========================
# PostgreSQL
# =========================

spring.datasource.url=${DB_POSTGRESQL_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# MongoDB Atlas
# =========================
spring.mongodb.uri=${DB_MONGO_URL}

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend
app.frontend.url=${FRONTEND_URL}

# Cloudinary
spring.cloudinary.url=${CLOUDINARY_URL}

# Correo que recibe los mensajes de Contactos
app.admin.email=${MAIL_USERNAME}

# =========================
# Server
# =========================
server.port=8080

