<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de correo</title>
    <!-- ESTE ARCHIVO ES PARA VÁLIDAR EL CORREO ELECTRÓNICO DE LOS USUARIOS -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .contenedor {
            width: 100%;
            padding: 40px 0;
        }
        .correo {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }
        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .titulo {
            font-size: 24px;
            margin-bottom: 15px;
        }
        .texto {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }
        .codigo {
            display: inline-block;
            margin: 25px 0;
            padding: 15px 25px;
            background-color: #eeeeee;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .expiracion {
            font-size: 14px;
            color: #777777;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="correo">

        <div class="logo">
            ⚽ CANCHEROS
        </div>

        <h1 class="titulo">
            Verifica tu correo
        </h1>

        <p class="texto">
            Gracias por registrarte en Cancheros.
        </p>

        <p class="texto">
            Utiliza el siguiente código para verificar tu correo:
        </p>

        <div class="codigo">
            <span th:text="${codigo}">123456</span>
        </div>

        <p class="expiracion">
            Este código expira en 10 minutos.
        </p>

        <p class="footer">
            Si tú no solicitaste este código, puedes ignorar este correo.
        </p>

    </div>

</div>

</body>
</html>
